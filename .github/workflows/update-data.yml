name: Atualizar dados de ataques (DShield)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Buscar dados no DShield
        env:
          DSHIELD_CONTACT: ${{ vars.DSHIELD_CONTACT || github.repository }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/fetch-dshield.mjs

      - name: Commitar data/attacks.json se houve mudanca
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/attacks.json
          if git diff --cached --quiet; then
            echo "Sem mudancas em data/attacks.json."
            exit 0
          fi
          git commit -m "chore: atualiza dados de ataques (DShield)"

          # Ate 3 tentativas: se o main andou (outro commit/execucao) ou o push
          # falhou por instabilidade, reaplica nosso commit por cima e tenta de
          # novo. "-X theirs" no rebase prefere o NOSSO commit (os dados novos)
          # em caso de conflito.
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Tentativa $attempt de 3 falhou."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Nao foi possivel publicar data/attacks.json apos 3 tentativas." >&2
          exit 1
